<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTIONER.DESIGN — OPTIONER PORTFOLIO</title>
<link rel="canonical" href="https://jorccarangan.github.io/optioner-portfolio/Index.html">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#050507;color:#ffffff;font-family:'Inter',sans-serif}
.titillium-bold{font-family:'Titillium Web',sans-serif;font-weight:700;letter-spacing:-0.02em}
.titillium-black{font-family:'Titillium Web',sans-serif;font-weight:900;line-height:0.9;letter-spacing:-0.03em}
.gradient-ships{background:linear-gradient(90deg,#6A1E5E,#A855F7 35%,#FF6A00 75%,#FFB86C);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tab{padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,0.1);background:#131316;color:rgba(255,255,255,0.6);font-size:13px;white-space:nowrap;cursor:pointer}
.tab.active{background:white;color:black;font-weight:700}
.thumb{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#111113;border:1px solid rgba(255,255,255,0.08);position:relative;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.dot{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,0.25)}
.dot.active{width:28px;background:#6A1E5E}
</style>
</head>
<body>
<header class="sticky top-0 z-40 bg-[#050507]/90 backdrop-blur border-b border-white/[0.06]">
<div class="max-w- mx-auto px-6 md:px-10 h- flex items-center justify-between">
<div class="flex items-center gap-3">
<img src="assets/logo-transparent.png" class="w-8 h-8 rounded-full" onerror="this.src='https://via.placeholder.com/32/6A1E5E/fff?text=O'"/>
<div class="leading-none">
<div class="flex gap-1.5"><span class="titillium-bold text- text-white">OPTIONER</span><span class="titillium-bold text- text-[#8B5CF6]">DESIGN</span></div>
<div class="text- tracking-[0.2em] uppercase text-white/50 mt-">AWESOME CREATIVE DESIGN</div>
</div>
</div>
<div class="text- text-white/40">Titillium-Bold • 92 assets</div>
</div>
<div class="border-t border-white/[0.05]"><div class="max-w- mx-auto px-6 md:px-10 overflow-x-auto"><div id="tabs" class="flex gap-2 py-3"></div></div></div>
</header>
<main class="max-w- mx-auto px-6 md:px-10 py-12">
<h1 class="titillium-black text- md:text- text-white">Design that <span class="gradient-ships">ships.</span><br>Brand, packaging,<br>UI/UX & AI<br>characters.</h1>
<p class="mt-6 text- leading-[1.7] text-white/60 max-w-">I'm <b class="text-white">Jorc Carangan</b> — <b class="text-white">Optioner Multimedia Services</b>. Check out my features AI <span class="text-[#A855F7] font-semibold">GoogleFlow Ready Branding</span> here - <b class="text-white">Milo Flow</b> and <b class="text-white">Kip 360</b>.</p>
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-5 mt-10"></div>
</main>
<script>
const portfolioData = { /* PASTE YOUR portfolio_updated.json HERE - 92 files */ };
const CATS=["eBlast","Packaging","Video and Animation","Social Media Posting","Amazon Pages","UI/UX","AI Branding","Logos and Others"];
let curCat=CATS[0];
function renderTabs(){document.getElementById('tabs').innerHTML=CATS.map(c=>`<button class="tab ${c===curCat?'active':''}" onclick="curCat='${c}';render()">${c} ${(portfolioData[c]||[]).length}</button>`).join('');}
function render(){const items=portfolioData[curCat]||[];document.getElementById('grid').innerHTML=items.map(it=>`<div class="thumb"><img src="https://drive.google.com/thumbnail?id=${it.id}&sz=w600"><div class="absolute bottom-0 p-2 text- bg-black/60 w-full truncate text-white">${it.name}</div></div>`).join('');}
renderTabs();render();
</script>
</body>
</html>
